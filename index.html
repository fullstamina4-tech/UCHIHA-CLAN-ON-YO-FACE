<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UCHIHA.GG — Members</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#08070a;color:#f8f3f4;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;z-index:-2;width:min(110vw,1050px);aspect-ratio:1;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;opacity:.34;background:repeating-conic-gradient(#8c0719 0deg 2deg,#1a060b 2deg 17deg,#3d0710 17deg 18deg,#12070a 18deg 45deg);mask:radial-gradient(circle,transparent 0 12%,#000 13% 16%,transparent 17% 23%,#000 24% 27%,transparent 28% 35%,#000 36% 39%,transparent 40% 100%);animation:spin 55s linear infinite}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#08070a55,#08070acc 65%,#08070a)}
@keyframes spin{to{rotate:360deg}}@keyframes pulse{50%{scale:1.07;filter:drop-shadow(0 0 18px #f21d45)}}
header{width:min(1180px,calc(100% - 36px));margin:auto;padding:25px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20}
.brand{font-weight:900;letter-spacing:.16em;font-size:13px;display:flex;align-items:center;gap:12px}.mark{width:30px;height:30px;border:2px solid #d8213a;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 20px #d8213a66}.mark:after{content:"";width:10px;height:10px;border-radius:50%;background:#ed2745;box-shadow:0 0 0 5px #ed274533}
nav{display:flex;gap:22px}nav a{font-size:11px;text-decoration:none;color:#d1c0c5;letter-spacing:.14em;text-transform:uppercase}nav a:hover{color:#ff5268}
.hero{text-align:center;padding:76px 18px 52px}.eyebrow{color:#ff5268;font-size:11px;letter-spacing:.34em;text-transform:uppercase;font-weight:800}.hero h1{font-family:Impact,Haettenschweiler,sans-serif;font-size:clamp(54px,10vw,112px);line-height:.91;letter-spacing:.035em;margin:17px 0;text-transform:uppercase;text-shadow:0 5px 35px #bb0b2a88}.hero h1 span,.section-head h2 span{color:#e5223f}.hero p{color:#bfb0b5;max-width:520px;margin:auto;font-size:14px;line-height:1.8}.line{width:76px;height:3px;background:#a60f21;margin:28px auto;box-shadow:0 0 20px #e21a3d}
main{width:min(1120px,calc(100% - 32px));margin:0 auto 70px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:24px 0 20px}.section-head h2{font-size:clamp(23px,4vw,34px);letter-spacing:.06em;margin:0;text-transform:uppercase}.section-head p{margin:6px 0 0;color:#a99ba0;font-size:12px}.count{font-size:10px;color:#f1b5bf;letter-spacing:.15em;border:1px solid #812032;padding:9px 12px;background:#24070d99}
.featured{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.member{position:relative;min-height:174px;border:1px solid #ffffff24;border-radius:5px;padding:19px 14px;background:linear-gradient(145deg,#26090feF,#100a0de8 70%);overflow:hidden;transition:.22s;animation:pulse 5s ease-in-out infinite}
.member:before{content:"";position:absolute;width:115px;height:115px;border:1px solid #c21b3544;border-radius:50%;right:-45px;top:-47px;box-shadow:0 0 0 12px #b7192510,0 0 0 26px #b7192509}.member:hover{transform:translateY(-5px);border-color:#d92b45}
.number{font-size:10px;color:#e34a60;letter-spacing:.16em;font-weight:800}.avatar{width:40px;height:40px;margin:15px 0 17px;border-radius:50%;display:grid;place-items:center;border:1px solid #a92036;background:radial-gradient(circle,#a8152c 0 18%,#360812 19% 54%,#12070a 55%);overflow:hidden}.avatar svg{width:100%;height:100%;filter:drop-shadow(0 0 5px #ff304e88)}.featured .avatar{width:76px;height:76px;border:2px solid #e23a50;box-shadow:0 0 24px #df173b66}.member h3{font-size:clamp(12px,1.4vw,17px);letter-spacing:.07em;margin:0;text-transform:uppercase;overflow-wrap:anywhere}.role{display:block;margin-top:7px;color:#9c8b91;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.roster .member{min-height:91px;padding:15px 14px;display:flex;align-items:center;gap:12px;animation:none;background:linear-gradient(120deg,#17090df2,#0d090cf2)}.roster .avatar{flex:0 0 34px;width:34px;height:34px;margin:0}.roster h3{font-size:12px}.roster .role{font-size:8px;margin-top:5px}.divider{height:1px;margin:36px 0 31px;background:linear-gradient(90deg,transparent,#9b1b30,transparent)}footer{border-top:1px solid #ffffff12;text-align:center;padding:28px 16px 34px;color:#8d7d83;font-size:10px;letter-spacing:.16em;text-transform:uppercase}footer strong{color:#e22a45}
@media(max-width:850px){.featured{grid-template-columns:repeat(3,minmax(0,1fr))}.roster{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){header{width:calc(100% - 28px)}nav{gap:12px}nav a{font-size:9px}.brand{font-size:11px}.hero{padding-top:58px}.featured,.roster{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.member{min-height:150px}.roster .member{min-height:80px;padding:12px 9px;gap:8px}.roster h3{font-size:10px}.section-head{align-items:start}.count{font-size:9px;padding:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark"></span> UCHIHA.GG</div><nav><a href="#elite">Core</a><a href="#roster">Roster</a></nav></header>
<section class="hero"><div class="eyebrow">One clan · One legacy</div><h1>Eyes of the <span>Uchiha</span></h1><p>UCHIHA TO BABY BAKA NAKAKALIMUTAN MO KUNG SINO BOSS.</p><div class="line"></div></section>
<main><section id="elite"><div class="section-head"><div><h2><span>//</span> THE GODS</h2><p>The five names at the top of the roster.</p></div><div class="count">01 — 05 / CORE</div></div><div class="featured" id="featured"></div></section><div class="divider"></div><section id="roster"><div class="section-head"><div><h2><span>//</span> Full Roster</h2><p>Every other member, all in one place.</p></div><div class="count" id="rosterCount">MEMBERS</div></div><div class="roster" id="members"></div></section></main>
<footer>UCHIHA.GG <strong>///</strong> Bloodline. Loyalty. Legacy.</footer>
<script>
const coreMembers=["XEI","MADARA","RYLLE","CLARK","JAS"];
const otherMembers=["OBITO","JP","TENAY","IZUNA","JAS","ZWU","KYOUKI","CHAKNO","ALEGRA","JAREN","KATARA","REN","RYUNO","SAVIA","SED","GARALGAL","KUROKAMI","SHITO","ITACHI","SANTOS","VIA","YAEJIN"];
function eye(i,advanced){const marks=Array.from({length:3},(_,n)=>{const a=n*120+(advanced?i*18:i*23);return advanced?'<path d="M50 44 C42 34 27 25 31 15 C35 5 49 11 50 22 C54 10 68 8 71 18 C75 30 59 38 50 44Z" transform="rotate('+a+' 50 50)" fill="#090609" stroke="#21040a" stroke-width="1.2"/>':'<g transform="rotate('+a+' 50 50)"><path d="M50 25 C59 20 67 27 64 35 C62 40 56 41 52 37 C50 34 51 30 54 29Z" fill="#090609"/><circle cx="50" cy="29" r="2.2" fill="#090609"/></g>'}).join('');return '<svg viewBox="0 0 100 100" aria-label="Sharingan"><defs><radialGradient id="iris'+(advanced?'m':'s')+i+'"><stop stop-color="#ff9aa7"/><stop offset=".35" stop-color="#e51b3d"/><stop offset="1" stop-color="#650615"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="#080609"/><circle cx="50" cy="50" r="43" fill="url(#iris'+(advanced?'m':'s')+i+')" stroke="#ff6378" stroke-width="1.5"/><circle cx="50" cy="50" r="34" fill="none" stroke="#39040c" stroke-width="1.5"/>'+marks+'<circle cx="50" cy="50" r="8" fill="#080609" stroke="#f0445b" stroke-width="1.5"/></svg>'}
function card(name,i,elite){const e=document.createElement('article');e.className='member';if(elite)e.classList.add('featured');e.innerHTML=(elite?'<span class="number">CORE / '+String(i+1).padStart(2,'0')+'</span>':'')+'<div class="avatar">'+eye(i,elite)+'</div><div><h3>'+name+'</h3><span class="role">'+(elite?'Core member · Mangekyo':'Clan member · Sharingan')+'</span></div>';return e}
coreMembers.forEach((n,i)=>document.getElementById('featured').appendChild(card(n,i,true)));otherMembers.forEach((n,i)=>document.getElementById('members').appendChild(card(n,i,false)));document.getElementById('rosterCount').textContent=String(otherMembers.length).padStart(2,'0')+' MEMBERS';
</script>
</body></html>
